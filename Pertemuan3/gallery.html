<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    body {
      margin: 0 2rem;
      background-color: rgb(197, 197, 197);
    }
    .image {
      display: flex;
      justify-content: space-around;
    }
    .image p {
      display: flex;
      justify-content: space-around;
    }

    img {
      width: 70px;
      height: 70px;
    }
  </style>
  <body>
    <div class="container">
      <hr />
      <h1>Bahasa dan Framework Yang Dikuasai :</h1>
      <hr />
      <div>
        <h4>BAHASA</h4>
      </div>
      <div class="image">
        <div>
          <img src="./image/java-logo_brandlogos.net_57zlb.png" alt="JAVA" />
          <p>Java</p>
        </div>
        <div>
          <img src="./image/PHP-logo.svg.png" alt="PHP" />
          <p>PHP</p>
        </div>
        <div>
          <img
            src="./image/javascript-logo-javascript-icon-transparent-free-png.webp"
            alt="Javascript"
          />
          <p>Javascript</p>
        </div>
        <div>
          <img src="./image/pyton.webp" alt="python" />
          <p>python</p>
        </div>
      </div>
      <hr />
      <div>
        <h4>FRAME WORK</h4>
      </div>
      <div class="image">
        <div>
          <img src="image/Laravel.svg.png" alt="Laravel" />
          <p>Laravel</p>
        </div>
        <div>
          <img src="image/React-icon.svg.png" alt="Laravel" />
          <p>Laravel</p>
        </div>
      </div>
      <hr />
    </div>
  </body>
</html>
